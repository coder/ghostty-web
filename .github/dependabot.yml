version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-zig
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      tooling:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /demo
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: ghostty-web
