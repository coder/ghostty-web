name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Check formatting
        run: bun run fmt

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

  typecheck:
    name: type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install

      - name: Check types
        run: bun run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - uses: actions/upload-artifact@v4
        with:
          name: ghostty-vt-wasm
          path: ghostty-vt.wasm
          retention-days: 7

  browser:
    name: browser (Chromium)
    needs: test
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      # setup-bun extracts a ZIP; the pinned Playwright image does not include unzip.
      - name: Install Bun setup prerequisite
        run: apt-get update -qq && apt-get install -y --no-install-recommends unzip
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/download-artifact@v4
        with:
          name: ghostty-vt-wasm
      - run: bun install --frozen-lockfile
      - name: Run browser tests
        run: bun run test:browser
      - name: Verify the packed package
        env:
          TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-results/package
        run: bun run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.2.15

      - uses: ./.github/actions/setup-zig
        with:
          version: 0.16.0

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      # The unpatched current API includes render/selection/formatter facilities:
      # intentionally budget 1 MiB instead of the old custom shim's 512 KiB.
      - name: Check WASM size
        run: |
          SIZE=$(stat -c%s ghostty-vt.wasm)
          echo "WASM size: $SIZE bytes"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "❌ Error: native libghostty-vt WASM exceeds the reviewed 1 MiB limit"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      - name: Build library
        run: bun run build
